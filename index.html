<style>
:root{
  --bg:#191426; --surface:#251d37; --surface-hi:#31274a;
  --text:#ece7f7; --muted:#a095bb; --accent:#a9c9ee;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;
  padding:48px 20px calc(48px + env(safe-area-inset-bottom,0px));
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.avatar{
  position:relative;width:148px;height:148px;border-radius:50%;
  overflow:hidden;border:2px solid var(--accent);
  box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--surface-hi);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.05)}
.avatar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(25,20,38,.28) 0 1px,transparent 1px 3px);
  animation:drift 6s linear infinite;
}
@keyframes drift{to{background-position:0 12px}}
h1{
  font-family:"Unbounded","Onest",system-ui,sans-serif;
  font-weight:500;font-size:1.4rem;line-height:1.3;letter-spacing:.01em;
  margin-top:28px;text-align:center;text-wrap:balance;
}
.sub{color:var(--muted);margin-top:8px;font-size:.98rem;text-align:center}
nav{width:100%;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.release{
  width:100%;margin-top:32px;display:flex;align-items:center;gap:16px;
  padding:12px;border-radius:16px;background:var(--surface-hi);
  border:1px solid var(--accent);color:var(--text);text-decoration:none;
  transition:transform .2s;
}
.release:hover{transform:translateY(-2px)}
.release:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.release:active{transform:none}
.cover{width:96px;height:96px;flex:none;border-radius:10px;object-fit:cover;background:var(--surface);display:block}
.release-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.release-label{color:var(--muted);font-size:.88rem}
.release-title{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:500;font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.release-cta{color:var(--accent);font-weight:500;font-size:.98rem;margin-top:4px}
.link{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:14px;
  background:var(--surface);color:var(--text);text-decoration:none;
  font-weight:500;font-size:1.05rem;
  border:1px solid transparent;
  transition:background .2s,border-color .2s,transform .2s;
}
.link svg{width:24px;height:24px;flex:none;fill:var(--accent)}
.link:hover{background:var(--surface-hi);border-color:var(--accent);transform:translateY(-2px)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.link:active{transform:none}
@media (prefers-reduced-motion:reduce){
  .avatar::after{animation:none}
  .link,.release{transition:none}
  .link:hover,.release:hover{transform:none}
}
</style>
